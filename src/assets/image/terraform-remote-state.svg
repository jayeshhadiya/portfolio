<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <!-- Transparent background: the page paints the theme colour behind this image. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="url(#g)"/>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Terraform State</text>
  <text x="70" y="222" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#ffffff">on AWS S3</text>
  <!-- Padlock: state locking -->
  <g transform="translate(800 170)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <path d="M-45 -10V-45A45 45 0 0 1 45 -45V-10"/>
