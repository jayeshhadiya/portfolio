    <circle cx="0" cy="40" r="12" fill="#ffffff" stroke="none"/>
    <line x1="0" y1="45" x2="0" y2="75"/>
  </g>
  <rect x="70" y="320" width="640" height="110" rx="14" fill="#0f172a" fill-opacity="0.55"/>
  <g font-family="Menlo, Consolas, monospace" font-size="26">
    <text x="100" y="365" fill="#a5f3fc">backend "s3" {</text>
    <text x="130" y="405" fill="#ffffff">use_lockfile = <tspan fill="#86efac">true</tspan></text>
  </g>
</svg>
