<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <!-- Transparent background: the page paints the theme colour behind this image. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="url(#g)"/>
  <text x="70" y="130" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Deploy to Kubernetes</text>
  <text x="70" y="198" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#ffffff">with GitHub Actions</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="70" y="290" width="220" height="90" rx="14" fill="#0f172a" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
    <text x="180" y="343">test</text>
    <rect x="390" y="290" width="220" height="90" rx="14" fill="#0f172a" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
    <text x="500" y="343">build &amp; push</text>
    <rect x="710" y="290" width="220" height="90" rx="14" fill="#0f172a" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
    <text x="820" y="343">deploy</text>
  </g>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="300" y1="335" x2="372" y2="335" marker-end="url(#arrow)"/>
    <line x1="620" y1="335" x2="692" y2="335" marker-end="url(#arrow)"/>
  </g>
  <text x="500" y="440" font-family="Menlo, Consolas, monospace" font-size="24" fill="#a5f3fc" text-anchor="middle">ghcr.io/owner/app:&lt;sha&gt;</text>
</svg>
