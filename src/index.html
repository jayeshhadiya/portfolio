<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <title>Jayesh Hadiya</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon-light.svg">
  <meta name="theme-color" content="#3867d6" />
  <!-- Fallbacks for pages that aren't prerendered; MetaService replaces them per page. -->
  <meta name="description" content="Portfolio of a DevOps engineer from India: CI/CD pipelines, Kubernetes, cloud infrastructure as code, and the tools I use every day.">
  <meta property="og:title" content="Jayesh Hadiya">
  <meta property="og:description" content="Portfolio of a DevOps engineer from India: CI/CD pipelines, Kubernetes, cloud infrastructure as code, and the tools I use every day.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jayesh Hadiya">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Apply the saved dark mode and theme color before the first paint, so the page
    // doesn't flash the defaults until Angular loads. Mirrors DarkModeService and ThemeService.
    try {
      var theme = localStorage.getItem('theme');
      var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.querySelector("link[rel*='icon']").href = 'assets/icons/favicon-' + (dark ? 'dark' : 'light') + '.svg';
      var color = localStorage.getItem('color');
      if (color && /^#[0-9a-f]{3,8}$/i.test(color)) {
        // Prerendered pages carry the default color inline on <app>; App removes this once it applies the color.
        var style = document.createElement('style');
        style.id = 'theme-color-preload';
        style.textContent = 'app{--primary-color:' + color + '!important}';
        document.head.appendChild(style);
      }
    } catch (e) {}
  </script>
  <link rel="alternate" type="application/rss+xml" title="Jayesh Hadiya - Blog" href="/rss.xml">
</head>

<body>
  <app>
    <div class="flex h-screen items-center justify-center">
      <div class="rounded-md h-12 w-12 border-4 border-t-4 border-black dark:border-white animate-spin absolute"></div>
    </div>
  </app>
</body>

</html>
